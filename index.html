<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administration Pro2Link</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0F4C81" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Thème choisi par l'utilisateur (préférence locale), appliqué avant le rendu.
      try {
        var t = localStorage.getItem('pl-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Pro2Link nécessite JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
